<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bit:bot Kontroll</title>
<style>
  :root {
    --bg: #0b0f1a;
    --bg2: #121a2e;
    --card: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.10);
    --text: #e8ecf5;
    --muted: #8a94ad;
    --cyan: #22d3ee;
    --green: #34d399;
    --red: #fb5c6d;
    --blue: #60a5fa;
    --purple: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(34, 211, 238, 0.18), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(167, 139, 250, 0.18), transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    background-attachment: fixed;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }

  header { text-align: center; margin-bottom: 20px; }
  h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 16px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    font-weight: 600;
  }

  /* Knapper */
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--text);
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.07);
    padding: 12px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  button:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-1px); }
  button:active { transform: translateY(1px) scale(0.98); }
  .btn-main { flex: 1; min-width: 150px; }
  #btnBt::before {
    content: "";
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--red);
    margin-right: 8px;
    box-shadow: 0 0 8px var(--red);
    vertical-align: middle;
  }
  #btnBt.connected { border-color: var(--green); box-shadow: 0 0 16px rgba(52, 211, 153, 0.35); }
  #btnBt.connected::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #btnCam { background: linear-gradient(135deg, rgba(34, 211, 238, 0.35), rgba(167, 139, 250, 0.35)); }

  /* Statuspanel */
  #status {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    padding: 24px 12px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--card);
    margin-bottom: 16px;
    transition: background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  #status.go   { background: rgba(52, 211, 153, 0.16); border-color: var(--green); box-shadow: 0 0 30px rgba(52, 211, 153, 0.35); }
  #status.stop { background: rgba(251, 92, 109, 0.16); border-color: var(--red);   box-shadow: 0 0 30px rgba(251, 92, 109, 0.4); animation: pulse 0.9s ease-in-out infinite; }
  #status.turn { background: rgba(96, 165, 250, 0.16); border-color: var(--blue);  box-shadow: 0 0 30px rgba(96, 165, 250, 0.35); }
  @keyframes pulse { 50% { box-shadow: 0 0 6px rgba(251, 92, 109, 0.2); } }

  /* Kamera */
  #webcam-container { display: flex; justify-content: center; }
  #webcam-container canvas {
    width: 100%;
    max-width: 280px;
    height: auto;
    border-radius: 16px;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 24px rgba(34, 211, 238, 0.3);
  }
  .placeholder { text-align: center; color: var(--muted); font-size: 14px; }

  /* Prediksjonsstolper */
  #label-container { margin-top: 14px; }
  .row { display: grid; grid-template-columns: 90px 1fr 44px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14px; }
  .row .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .track { height: 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .row .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--cyan), var(--purple)); transition: width 0.12s ease; }
  .row .pct { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  /* Styrekors */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-areas:
      ". up ."
      "left mid right"
      ". down .";
    gap: 10px;
    max-width: 280px;
    margin: 0 auto;
  }
  .dpad button { padding: 16px 0; font-size: 15px; }
  .dpad .up    { grid-area: up;    border-color: var(--green); }
  .dpad .down  { grid-area: down;  border-color: var(--red); }
  .dpad .left  { grid-area: left;  border-color: var(--blue); }
  .dpad .right { grid-area: right; border-color: var(--blue); }
  .dpad .mid   { grid-area: mid; display: grid; place-items: center; font-size: 28px; }
  .dpad .up:hover    { box-shadow: 0 0 16px rgba(52, 211, 153, 0.4); }
  .dpad .down:hover  { box-shadow: 0 0 16px rgba(251, 92, 109, 0.4); }
  .dpad .left:hover, .dpad .right:hover { box-shadow: 0 0 16px rgba(96, 165, 250, 0.4); }

  .info { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .info b { color: var(--cyan); font-weight: 600; }

  /* Innstillinger */
  details { margin-bottom: 16px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; padding: 4px 2px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
  select {
    font: inherit;
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    min-width: 140px;
  }
  select option { color: #111; }

  #log {
    margin: 12px 0 0;
    padding: 10px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.3);
    color: var(--muted);
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    white-space: pre-line;
    max-height: 160px;
    overflow: auto;
  }

  @media (prefers-reduced-motion: reduce) {
    #status.stop { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🤖 Bit:bot Kontroll</h1>
    <p class="sub">Styr roboten med kameraet: opp, ned, venstre og høyre</p>
  </header>

  <div class="card">
    <h2>Oppkobling</h2>
    <div class="btn-row">
      <button id="btnBt" class="btn-main" type="button">Koble til micro:bit</button>
      <button id="btnCam" class="btn-main" type="button">Start kamera</button>
    </div>
  </div>

  <div id="status">Ikke startet</div>

  <div class="card">
    <h2>Kamera</h2>
    <div id="webcam-container"><div class="placeholder">Trykk «Start kamera» for å begynne</div></div>
    <div id="label-container"></div>
  </div>

  <div class="card">
    <h2>Manuell styring</h2>
    <div class="dpad">
      <button class="up"    type="button" onclick="send('GO')">⬆ Kjør</button>
      <button class="left"  type="button" onclick="send('LEFT')">⬅ Venstre</button>
      <div class="mid">🤖</div>
      <button class="right" type="button" onclick="send('RIGHT')">Høyre ➡</button>
      <button class="down"  type="button" onclick="send('ALARM')">⬇ Stopp</button>
    </div>
    <div class="info">
      <span>Sist sendt: <b id="sent">ingenting</b></span>
      <span>Micro:biten svarte: <b id="echo">ingenting ennå</b></span>
    </div>
  </div>

  <details class="card">
    <summary>Innstillinger og logg</summary>
    <label>OPP (kjør) <select id="upClass"></select></label>
    <label>NED (stopp) <select id="downClass"></select></label>
    <label>VENSTRE (sving) <select id="leftClass"></select></label>
    <label>HØYRE (sving) <select id="rightClass"></select></label>
    <p id="log"></p>
  </details>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script>
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/_FJjOX8Ou/";

  // UART-tjenesten micro:bit bruker. Micro:bit har byttet om kanalene i forhold til standard
  // Nordic UART, så vi finner riktig skrive- og lytte-kanal automatisk ut fra egenskapene.
  const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

  const CONFIDENCE = 0.8;   // hvor sikker modellen må være
  const FRAMES_NEEDED = 10; // antall bilder på rad før tilstanden byttes (hindrer flimring)

  // tilstand -> kommando til micro:biten
  const COMMANDS = { up: "GO", down: "ALARM", left: "LEFT", right: "RIGHT" };
  const LABELS = {
    up:    ["⬆️ Opp – roboten kjører", "go"],
    down:  ["⬇️ Ned – STOPP + alarm", "stop"],
    left:  ["⬅️ Venstre – svinger til venstre", "turn"],
    right: ["➡️ Høyre – svinger til høyre", "turn"]
  };

  let model, webcam, labelContainer, maxPredictions;
  let uartChar = null;
  let currentState = null;
  let candidate = null, candidateCount = 0;
  let sending = false, pendingCmd = null;

  const $ = id => document.getElementById(id);
  const log = t => { $("log").textContent = t + "\n" + $("log").textContent; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function setConnected(on) {
    $("btnBt").classList.toggle("connected", on);
    $("btnBt").textContent = on ? "Tilkoblet" : "Koble til micro:bit";
  }

  // ---------- Bluetooth ----------
  $("btnBt").onclick = async () => {
    try {
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [UART_SERVICE]
      });
      device.addEventListener("gattserverdisconnected", () => {
        uartChar = null; sending = false; pendingCmd = null;
        log("Bluetooth frakoblet"); setConnected(false);
      });
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(UART_SERVICE);

      // Finn kanalen vi kan skrive til, og kanalen micro:biten svarer på
      const chars = await service.getCharacteristics();
      let rx = null, tx = null;
      for (const c of chars) {
        const p = c.properties;
        if (!rx && (p.write || p.writeWithoutResponse)) rx = c;
        if (!tx && p.notify) tx = c;
      }
      if (!rx) throw new Error("Fant ingen kanal å skrive til");
      uartChar = rx;

      if (tx) {
        try {
          await tx.startNotifications();
          tx.addEventListener("characteristicvaluechanged", e => {
            $("echo").textContent = new TextDecoder().decode(e.target.value).trim();
          });
        } catch (e) { log("Kunne ikke lytte på svar: " + e.message); }
      }

      setConnected(true);
      log("Koblet til " + device.name);
      if (currentState) send(COMMANDS[currentState]);
    } catch (e) { log("Bluetooth-feil: " + e.message); }
  };

  async function send(cmd) {
    if (!uartChar) { $("sent").textContent = "ikke koblet til micro:bit!"; return; }
    $("sent").textContent = cmd;

    // siste kommando vinner, og bare én skriving om gangen
    pendingCmd = cmd;
    if (sending) return;
    sending = true;

    while (pendingCmd !== null && uartChar) {
      const c = pendingCmd;
      pendingCmd = null;
      const data = new TextEncoder().encode(c + "\n");
      try {
        if (uartChar.properties.write) await uartChar.writeValueWithResponse(data);
        else await uartChar.writeValueWithoutResponse(data);
      } catch (e) {
        log("Sendefeil: " + e.message);
      }
      await sleep(80);
    }
    sending = false;
  }

  // Send gjeldende kommando på nytt hvert sekund. Micro:biten stopper selv hvis den ikke hører noe på 3 sekunder.
  setInterval(() => { if (currentState && uartChar) send(COMMANDS[currentState]); }, 1000);

  // ---------- Tilstandsbytte ----------
  function setState(state) {
    if (state === currentState) return;
    currentState = state;
    const s = $("status");
    s.textContent = LABELS[state][0];
    s.className = LABELS[state][1];
    send(COMMANDS[state]);
  }

  // ---------- Teachable Machine ----------
  function fillSelect(sel, labels, regex, allowNone) {
    sel.innerHTML = "";
    if (allowNone) sel.add(new Option("(ingen)", ""));
    labels.forEach(l => sel.add(new Option(l, l)));
    for (const o of sel.options) if (o.value && regex.test(o.value)) sel.value = o.value;
  }

  $("btnCam").onclick = async () => {
    $("btnCam").disabled = true;
    $("status").textContent = "Laster modell …";
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    maxPredictions = model.getTotalClasses();
    const labels = model.getClassLabels();

    // gjetter automatisk ut fra klassenavnene
    fillSelect($("upClass"),    labels, /opp|up/i,         false);
    fillSelect($("downClass"),  labels, /ned|down/i,       false);
    fillSelect($("leftClass"),  labels, /venstre|left/i,   true);
    fillSelect($("rightClass"), labels, /h[øo]yre|right/i, true);
    log("Klasser i modellen: " + labels.join(", "));

    webcam = new tmImage.Webcam(200, 200, true);
    await webcam.setup();
    await webcam.play();
    $("webcam-container").innerHTML = "";
    $("webcam-container").appendChild(webcam.canvas);

    labelContainer = $("label-container");
    labelContainer.innerHTML = "";
    for (let i = 0; i < maxPredictions; i++) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = '<span class="name"></span><div class="track"><div class="fill"></div></div><span class="pct"></span>';
      labelContainer.appendChild(row);
    }
    $("status").textContent = "Leser kamera …";
    window.requestAnimationFrame(loop);
  };

  async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
  }

  async function predict() {
    const prediction = await model.predict(webcam.canvas);
    let best = prediction[0];
    for (let i = 0; i < maxPredictions; i++) {
      const row = labelContainer.childNodes[i];
      const p = prediction[i].probability;
      row.querySelector(".name").textContent = prediction[i].className;
      row.querySelector(".fill").style.width = (p * 100).toFixed(0) + "%";
      row.querySelector(".pct").textContent = (p * 100).toFixed(0) + "%";
      if (p > best.probability) best = prediction[i];
    }
    if (best.probability < CONFIDENCE) return;

    // Andre klasser (f.eks. bakgrunn) endrer ingenting
    let state = null;
    if (best.className === $("upClass").value) state = "up";
    else if (best.className === $("downClass").value) state = "down";
    else if ($("leftClass").value && best.className === $("leftClass").value) state = "left";
    else if ($("rightClass").value && best.className === $("rightClass").value) state = "right";
    if (!state) { candidate = null; candidateCount = 0; return; }

    if (state === candidate) candidateCount++; else { candidate = state; candidateCount = 1; }
    if (candidateCount >= FRAMES_NEEDED) setState(state);
  }
</script>
</body>
</html>
